<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>yourStyl(e)st.26 — Fashion</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* LOGO */

    .logo {
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    .your {
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .main-logo {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    /* HEADER */

    header {
      width: 100%;
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      background: #080808;
      z-index: 100;
    }

    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    nav a {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    nav a:hover {
      opacity: 0.55;
    }

    /* HOME */

    .home {
      min-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    .home .your {
      font-size: clamp(24px, 5vw, 55px);
      font-weight: 300;
    }

    .home .main-logo {
      font-size: clamp(50px, 13vw, 170px);
      font-weight: 700;
      letter-spacing: 7px;
    }

    .home p {
      margin-top: 25px;
      color: #999;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* SECTIONS */

    section {
      padding: 100px 40px;
      border-top: 1px solid #222;
    }

    .section-title {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 4px;
      margin-bottom: 50px;
    }

    /* SHOP */

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .product {
      min-height: 400px;
      border: 1px solid #292929;
      display: flex;
      align-items: flex-end;
      padding: 25px;
      transition: opacity 0.2s;
    }

    .product:hover,
    .collection:hover,
    .lookbook:hover {
      opacity: 0.65;
    }

    .product h3 {
      font-size: 15px;
      letter-spacing: 2px;
      font-weight: 400;
    }

    .product p {
      margin-top: 8px;
      color: #999;
      font-size: 13px;
    }

    /* COLLECTIONS */

    .collections {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .collection {
      min-height: 350px;
      border: 1px solid #292929;
      padding: 30px;
      display: flex;
      align-items: flex-end;
    }

    .collection h3 {
      font-size: 22px;
      letter-spacing: 3px;
      font-weight: 400;
    }

    /* LOOKBOOK */

    .lookbook {
      min-height: 400px;
      border: 1px solid #292929;
      display: flex;
      align-items: flex-end;
      padding: 30px;
    }

    .lookbook h3 {
      font-size: 22px;
      letter-spacing: 3px;
      font-weight: 400;
    }

    /* ABOUT */

    .about {
      max-width: 700px;
    }

    .about p,
    .contact p {
      color: #aaa;
      font-size: 16px;
      line-height: 1.8;
    }

    /* CONTACT */

    .contact {
      max-width: 700px;
    }

    /* FOOTER */

    footer {
      padding: 40px;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-between;
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      header {
        padding: 22px 20px;
        flex-direction: column;
        gap: 20px;
      }

      nav {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
