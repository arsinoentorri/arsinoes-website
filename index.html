<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>yourStyl(e)st.26 — Fashion</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* LOGO */

    .logo {
      display: inline-flex;
      align-items: baseline;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .logo .your {
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .logo .main {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    /* HEADER */

    header {
      width: 100%;
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      background: #080808;
      z-index: 10;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      font-size: 12px;
      letter-spacing: 2px;
    }

    /* HOME */

    .home {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    .home .logo .your {
      font-size: clamp(25px, 5vw, 55px);
      font-weight: 300;
      letter-spacing: 2px;
    }

    .home .logo .main {
      font-size: clamp(55px, 13vw, 170px);
      font-weight: 700;
      letter-spacing: 8px;
    }

    .home p {
      margin-top: 20px;
      color: #999;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* SHOP */

    section {
      padding: 100px 40px;
      border-top: 1px solid #222;
    }

    .section-title {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 4px;
      margin-bottom: 50px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .product {
      min-height: 400px;
      border: 1px solid #292929;
      display: flex;
      align-items: flex-end;
      padding: 25px;
    }

    .product h3 {
      font-size: 15px;
      letter-spacing: 2px;
      font-weight: 400;
    }

    .product p {
      margin-top: 8px;
      color: #999;
      font-size: 13px;
    }

    /* COLLECTIONS */

    .collections {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .collection {
      min-height: 350px;
      border: 1px solid #292929;
      padding: 30px;
      display: flex;
      align-items: flex-end;
    }

    .collection h3 {
      font-size: 22px;
      letter-spacing: 3px;
      font-weight: 400;
    }

    /* ABOUT */

    .about {
      max-width: 700px;
    }

    .about p {
      color: #aaa;
      font-size: 16px;
      line-height: 1.8;
    }

    /* FOOTER */

    footer {
      padding: 40px;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      header {
        padding: 22px 20px;
      }

      .logo .your {
        font-size: 10px;
      }

      .logo .main {
        font-size: 18px;
        letter-spacing: 2px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 9px;
      }

      section {
        padding: 70px 20px;
      }

      .home .logo .your {
        font-size: 22px;
      }

      .home .logo .main {
        font-size: 42px;
        letter-spacing: 4px;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .collections {
        grid-template-columns: 1fr;
      }

      .product {
        min-height: 300px;
      }

      footer {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <a href="#home" class="logo">
      <span class="your">your</span><span class="main">Styl(e)st.26</span>
